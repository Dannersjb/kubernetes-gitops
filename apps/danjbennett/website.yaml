apiVersion: apps/v1
kind: Deployment
metadata:
  name: danjbennett
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: danjbennett
  template:
    metadata:
      labels:
        app: danjbennett
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: website
          image: registry.dannersjb.co.uk/websites/danjbennett:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: danjbennett-env
---
apiVersion: v1
kind: Service
metadata:
  name: danjbennett
  namespace: default
spec:
  type: NodePort
  selector:
    app: danjbennett
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30081
